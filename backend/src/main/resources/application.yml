server:
  port: 8080

spring:
  application:
    name: silvys-kitchen-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 20MB

  # Database configuration: Default to PostgreSQL when DB environment variables are supplied, with H2 fallback for local dev
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:silvyskitchendb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:}

  h2:
    console:
      enabled: ${SPRING_H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# Configurable Application Settings
app:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:silvy123}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,http://localhost:4173,http://localhost:8080}
  whatsapp:
    phone-number: ${WHATSAPP_PHONE_NUMBER:917639164647}

logging:
  level:
    com.silvyskitchen: DEBUG
    org.springframework.web: INFO
